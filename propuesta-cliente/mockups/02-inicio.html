<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="_base.css">
<title>02 · Inicio (elegir modo)</title>
</head>
<body class="canvas">
  <div class="phone"><div class="screen">
    <div class="statusbar"><span>9:41</span><span class="sb-right">●●● ▂▄▆ ▮</span></div>

    <div class="appbar">
      <div class="avatar">CM</div>
      <div><div class="h2">Hola, Carlos</div><div class="tiny muted">¿Qué necesitás hoy?</div></div>
      <div class="spacer"></div>
      <div class="iconbtn">🔔</div>
    </div>

    <div class="mapsim" style="flex:1">
      <div class="park" style="width:80px;height:60px;right:20px;top:60px"></div>
      <div class="pin b"></div>
      <div class="pin g" style="left:60px;top:150px"></div>
      <div class="pin g" style="right:70px;top:210px"></div>
    </div>

    <div class="sheet" style="margin-top:-70px">
      <div class="handle"></div>
      <div class="chips" style="margin-bottom:14px">
        <span class="chip on">🚕 Viaje</span>
        <span class="chip">🛒 Mandado</span>
      </div>

      <div class="field" style="margin-bottom:14px">
        <span>🔍</span><span class="ph">¿A dónde vamos?</span>
      </div>

      <div class="label" style="margin:6px 0 6px">Destinos frecuentes</div>
      <div class="list">
        <div class="row"><div class="ic">🏠</div><div class="t"><div class="a">Casa</div><div class="b">Barrio Equipetrol</div></div></div>
        <div class="row"><div class="ic">🏢</div><div class="t"><div class="a">Trabajo</div><div class="b">Av. Monseñor Rivero</div></div></div>
        <div class="row"><div class="ic">🕒</div><div class="t"><div class="a">Último destino</div><div class="b">Plaza principal</div></div></div>
      </div>
    </div>
  </div></div>
</body>
</html>
