<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="_base.css">
<title>06 · Panel del conductor</title>
</head>
<body class="canvas">
  <div class="phone"><div class="screen">
    <div class="statusbar on-dark" style="background:#0b1220"><span>9:41</span><span class="sb-right">●●● ▂▄▆ ▮</span></div>

    <div style="background:#0b1220;color:#fff;padding:10px 18px 24px;border-radius:0 0 24px 24px">
      <div style="display:flex;align-items:center;gap:12px">
        <div class="avatar" style="background:#1e293b;color:#fff">JP</div>
        <div style="flex:1"><div style="font-weight:800">Hola, Juan</div><div class="tiny" style="opacity:.7">Conductor · Moto</div></div>
        <div class="iconbtn" style="background:#1e293b;color:#fff">👤</div>
      </div>

      <div class="card" style="margin-top:16px;background:#111c33;box-shadow:none;border:1px solid #1e293b">
        <div style="display:flex;align-items:center;justify-content:space-between">
          <div>
            <span class="badge" style="background:rgba(34,197,94,.18);color:#4ade80">● En línea</span>
            <div class="tiny" style="color:#94a3b8;margin-top:8px">Recibiendo solicitudes de viaje</div>
          </div>
          <div class="switch" style="background:var(--ok)"><div class="knob"></div></div>
        </div>
      </div>
    </div>

    <div class="pad" style="margin-top:16px">
      <div class="label" style="margin-bottom:10px">Resumen de hoy</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div class="card flat"><div class="k tiny muted" style="font-weight:700">GANANCIAS</div><div class="big" style="font-size:24px">Bs 180</div></div>
        <div class="card flat"><div class="k tiny muted" style="font-weight:700">VIAJES</div><div class="big" style="font-size:24px">8</div></div>
      </div>
    </div>

    <div class="mapsim grow" style="margin-top:16px;border-radius:20px 20px 0 0">
      <div class="pin b" style="top:70px"></div>
      <div class="hint-pill" style="left:24px;top:110px">Esperando solicitudes…</div>
    </div>
  </div></div>
</body>
</html>
