<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="_base.css">
<title>01 · Login pasajero</title>
</head>
<body class="canvas">
  <div class="phone"><div class="screen">
    <div class="statusbar"><span>9:41</span><span class="sb-right">●●● ▂▄▆ ▮</span></div>
    <div class="center" style="justify-content:flex-start;padding-top:64px">
      <div style="width:76px;height:76px;border-radius:22px;background:var(--brand);display:grid;place-items:center;color:#fff;font-size:38px;box-shadow:var(--shadow)">🛣️</div>
      <h1 class="h1" style="margin-top:20px">Bienvenido a Ruta</h1>
      <p class="muted" style="margin:8px 0 36px;max-width:250px">Viajes y mandados en tu ciudad, en un solo lugar.</p>

      <div style="width:100%;text-align:left">
        <div class="label" style="margin-bottom:8px">Número de celular</div>
        <div class="field">
          <span class="flag">🇧🇴 +591</span>
          <span style="width:1px;height:24px;background:var(--line)"></span>
          <span class="ph">7XX XX XX XX</span>
        </div>
        <button class="btn primary" style="margin-top:18px">Continuar</button>
        <p class="tiny muted" style="text-align:center;margin-top:14px">Te enviaremos un código por SMS para verificar tu número.</p>
      </div>
    </div>
    <div class="pad" style="padding-bottom:22px">
      <p class="tiny muted" style="text-align:center">Al continuar aceptás los <b>Términos</b> y la <b>Política de Privacidad</b>.</p>
    </div>
  </div></div>
</body>
</html>
