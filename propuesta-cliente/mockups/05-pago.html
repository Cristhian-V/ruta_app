<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="_base.css">
<title>05 · Pago y calificación</title>
</head>
<body class="canvas">
  <div class="phone"><div class="screen">
    <div class="statusbar"><span>9:41</span><span class="sb-right">●●● ▂▄▆ ▮</span></div>
    <div class="center" style="justify-content:flex-start;padding-top:44px">
      <div style="width:64px;height:64px;border-radius:50%;background:#dcfce7;display:grid;place-items:center;font-size:32px">✅</div>
      <h1 class="h2" style="margin-top:14px">¡Viaje completado!</h1>
      <p class="muted small" style="margin:6px 0 22px">Gracias por viajar con Ruta</p>

      <div style="width:100%;text-align:left">
        <div class="card flat">
          <div class="row" style="border:0"><div class="t"><div class="b">Recorrido</div><div class="a" style="font-weight:700">6,0 km · 18 min</div></div></div>
          <div class="progress" style="margin:6px 0 2px"><i style="width:0"></i></div>
          <div class="row" style="border:0"><div class="t"><div class="b">Tarifa</div><div class="a">Bs 36</div></div></div>
          <div style="border-top:1px dashed var(--line);margin:6px 0"></div>
          <div style="display:flex;justify-content:space-between;align-items:center">
            <span style="font-weight:800">Total</span>
            <span class="big" style="font-size:24px">Bs 36</span>
          </div>
        </div>

        <div class="card flat" style="margin-top:12px;display:flex;align-items:center;gap:12px">
          <div class="ic" style="width:42px;height:42px;border-radius:12px;background:#dcfce7;display:grid;place-items:center;font-size:22px">💵</div>
          <div style="flex:1"><div style="font-weight:700">Pago en efectivo</div><div class="tiny muted">Pagá directamente al conductor</div></div>
        </div>

        <div style="text-align:center;margin-top:22px">
          <div class="label" style="margin-bottom:8px">¿Cómo calificás a Juan?</div>
          <div class="stars">★★★★★</div>
        </div>

        <button class="btn primary dark" style="margin-top:22px">Finalizar</button>
      </div>
    </div>
  </div></div>
</body>
</html>
