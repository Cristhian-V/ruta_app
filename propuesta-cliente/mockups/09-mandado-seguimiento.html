<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="_base.css">
<title>09 · Seguimiento del mandado</title>
</head>
<body class="canvas">
  <div class="phone"><div class="screen">
    <div class="statusbar on-dark" style="position:absolute;width:100%"><span>9:41</span><span class="sb-right">●●● ▂▄▆ ▮</span></div>

    <div class="mapsim" style="flex:1">
      <svg viewBox="0 0 360 620" preserveAspectRatio="none">
        <path d="M40 120 C120 160 150 260 250 320 S320 460 300 560"
              fill="none" stroke="#1d4ed8" stroke-width="7" stroke-linecap="round"/>
        <circle cx="40" cy="120" r="9" fill="#2563eb" stroke="#fff" stroke-width="4"/>
        <circle cx="300" cy="560" r="9" fill="#ef4444" stroke="#fff" stroke-width="4"/>
        <g transform="translate(214,258)"><circle r="18" fill="#0b1220"/><text x="0" y="7" text-anchor="middle" font-size="18">🏍️</text></g>
      </svg>
      <div class="hint-pill" style="left:24px;top:70px;background:#0b1220;color:#fff">Llega en <b>6 min</b></div>
    </div>

    <div class="sheet">
      <div class="handle"></div>
      <div class="progress" style="margin-bottom:14px"><i style="width:66%"></i></div>
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px">
        <span class="badge soft">🛒 Comprando</span>
        <span class="tiny muted">El repartidor está en el mercado</span>
      </div>

      <div class="card flat" style="padding:8px 14px;margin-bottom:12px">
        <div class="row"><div class="t"><div class="a small">2 kg de arroz</div></div><div class="v small">Bs 18</div></div>
        <div class="row"><div class="t"><div class="a small">1 pan de leche</div></div><div class="v small">Bs 12</div></div>
        <div class="row"><div class="t"><div class="a small">Verduras surtidas</div></div><div class="v small">Bs 22</div></div>
        <div class="row" style="border-top:1px dashed var(--line)"><div class="t"><div class="a">Total gastado</div></div><div class="v">Bs 52</div></div>
      </div>

      <div style="display:flex;align-items:center;gap:14px">
        <div class="avatar" style="width:46px;height:46px;font-size:16px">LM</div>
        <div style="flex:1"><div style="font-weight:800">Luis Mamani</div><div class="tiny muted">⭐ 4,8 · Repartidor</div></div>
        <div class="iconbtn">📞</div>
        <div class="iconbtn">💬</div>
      </div>
    </div>
  </div></div>
</body>
</html>
